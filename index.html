<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ENIGMA v2.1 • Chess Analysis</title>
<style>
:root{
  --bg:#0b1711; --bg2:#0e1e15; --panel:#13251b; --panel2:#182d20;
  --line:rgba(238,242,223,.15); --cream:#eef2df; --muted:#aab7a6;
  --accent:#6f9852; --accent2:#83aa67; --board-dark:#31552e; --board-light:#eef2df;
  --selected:#a7cf80; --danger:#d9897e;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 18% 0%,#15301f 0%,transparent 30%),radial-gradient(circle at 88% 12%,#15281f 0%,transparent 32%),var(--bg);color:var(--cream);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.app{width:100%;height:100%;display:flex;flex-direction:column}
.header{height:56px;flex:0 0 56px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--line);background:rgba(7,17,12,.92)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{position:relative;width:32px;height:24px;flex:0 0 32px}
.brand-mark:before{content:"";position:absolute;left:4px;top:7px;width:24px;height:14px;border-radius:50% 50% 48% 48%;background:#8caf6c}
.brand-mark:after{content:"";position:absolute;left:9px;top:2px;width:6px;height:6px;border-radius:50%;background:#8caf6c;box-shadow:9px 0 0 #8caf6c}
.brand-mouth{position:absolute;left:11px;top:14px;width:11px;height:3px;border-radius:4px;background:var(--bg);z-index:2}
.brand-name{font-family:Georgia,"Times New Roman",serif;font-size:24px;letter-spacing:.26em;line-height:1}
.brand-divider{width:1px;height:23px;background:rgba(238,242,223,.24);margin-left:1px}
.version{font-size:11px;letter-spacing:.16em;color:var(--muted)}
.header-right{font-size:10px;letter-spacing:.34em;color:#cbd4c7}
.main{flex:1;min-height:0;height:calc(100vh - 56px);padding:10px 20px 12px}
.setup-view,.analysis-view{width:100%;height:100%}
.hidden{display:none!important}
.setup-view{display:flex;align-items:center;justify-content:center}
.setup-content{height:100%;max-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-width:0}
.board-frame{width:min(64vh,680px,78vw);aspect-ratio:1;padding:5px;border:1px solid rgba(238,242,223,.18);border-radius:12px;background:#0f2116;box-shadow:0 22px 55px rgba(0,0,0,.32);flex:0 0 auto}
.board{width:100%;height:100%;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));border-radius:8px;overflow:hidden}
.sq{position:relative;min-width:0;min-height:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;user-select:none;cursor:pointer;overflow:hidden}
.sq.light{background:var(--board-light)} .sq.dark{background:var(--board-dark)}
.sq.selected{box-shadow:inset 0 0 0 3px var(--selected)}
.sq.last{box-shadow:inset 0 0 0 999px rgba(167,207,128,.22)}
.coord{position:absolute;z-index:4;font-size:9px;font-weight:800;line-height:1;opacity:.72;pointer-events:none}
.rank{left:4px;top:4px} .file{right:4px;bottom:4px} .sq.light .coord{color:#43583f} .sq.dark .coord{color:#e2ead8}
.piece{position:absolute;z-index:2;width:88%;height:88%;object-fit:contain;object-position:center;display:block;pointer-events:none;user-select:none}
.setup-tools{width:min(64vh,680px,78vw);display:flex;align-items:center;gap:6px;min-width:0}
.palette{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;flex:1;min-width:0}
.piece-btn{height:36px;min-width:0;padding:3px;border-radius:7px;border:1px solid var(--line);background:rgba(19,37,27,.92);display:flex;align-items:center;justify-content:center;transition:transform .12s,border-color .12s,background .12s}
.piece-btn:hover{border-color:rgba(238,242,223,.32);transform:translateY(-1px)}
.piece-btn.selected{background:#2c4b2b;border-color:var(--selected);box-shadow:0 0 0 1px var(--selected)}
.piece-btn img{width:100%;height:100%;object-fit:contain}
.tool-btn,.action-btn{height:36px;padding:0 11px;border:1px solid var(--line);background:rgba(19,37,27,.92);color:var(--cream);border-radius:8px;font-size:11px;font-weight:800;white-space:nowrap}
.tool-btn:hover,.action-btn:hover{border-color:rgba(238,242,223,.34)}
.tool-btn.active{background:#2c4b2b;border-color:var(--selected)}
.action-row{width:min(64vh,680px,78vw);display:flex;align-items:center;gap:6px;min-width:0}
.action-row .action-btn{flex:0 0 auto}
.side-toggle{margin-left:auto;display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:rgba(19,37,27,.92)}
.side-toggle button{height:36px;min-width:34px;border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:850}
.side-toggle button.active{background:#355733;color:#f0f4e8}
.fen-row{width:min(64vh,680px,78vw);display:flex;gap:6px;min-width:0}
.fen-row input{height:34px;flex:1;min-width:0;background:#0e1711;border:1px solid var(--line);border-radius:8px;color:var(--cream);padding:0 10px;outline:none;font-size:11px}
.fen-row input:focus{border-color:#607b59}
.fen-load{height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--cream);padding:0 12px;font-size:11px;font-weight:800}
.go-btn{width:min(230px,42vw);height:42px;border:0;border-radius:10px;background:var(--accent);color:white;font-size:13px;font-weight:900;letter-spacing:.16em;box-shadow:0 10px 26px rgba(75,113,56,.26);margin-top:1px}
.go-btn:hover{background:var(--accent2)} .go-btn:disabled{opacity:.45;cursor:not-allowed}
.status-line{min-height:15px;font-size:10px;color:var(--muted);text-align:center}
.analysis-view{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:center;max-width:1400px;margin:0 auto}
.analysis-board-wrap{display:flex;justify-content:flex-end;align-items:center;min-width:0}
.analysis-board-frame{width:min(72vh,46vw,640px);aspect-ratio:1;padding:5px;border:1px solid rgba(238,242,223,.18);border-radius:12px;background:#0f2116;box-shadow:0 22px 55px rgba(0,0,0,.32)}
.analysis-card{width:min(100%,680px);justify-self:start;border:1px solid rgba(238,242,223,.14);background:linear-gradient(180deg,rgba(18,39,28,.97),rgba(12,28,19,.97));border-radius:16px;padding:20px;box-shadow:0 22px 55px rgba(0,0,0,.28);height:min(72vh,640px);overflow:hidden;display:flex;flex-direction:column}
.analysis-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.analysis-title{display:flex;align-items:center;gap:10px}
.analysis-icon{font-size:22px;color:var(--cream)} .analysis-title h2{font-family:Georgia,"Times New Roman",serif;font-size:27px;font-weight:400;margin:0}
.engine-pill{padding:6px 9px;border-radius:8px;background:#24372a;border:1px solid #53694a;color:#cbd7c2;font-size:9px;letter-spacing:.08em;white-space:nowrap}
.engine-pill:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#8eb76a;margin-right:6px}
.engine-pill.thinking:before{background:#d4bd69;animation:pulse 1s infinite} .engine-pill.error{color:#f0c5bd;border-color:#71483f;background:#3d2824} .engine-pill.error:before{background:#d37a6f}
@keyframes pulse{50%{opacity:.25}}
.best-card{background:#20382a;border:1px solid #4c6c47;border-radius:12px;padding:15px;margin-bottom:14px}
.best-tag{display:inline-block;padding:4px 8px;border-radius:6px;background:#5f8b46;color:#eff5e8;font-size:9px;font-weight:850;letter-spacing:.08em;text-transform:uppercase;margin-bottom:7px}
.best-line{display:flex;align-items:baseline;gap:9px} .best-move{font-size:30px;font-weight:900} .eval{font-size:12px;color:#becdb8}
.why{margin-top:7px;color:#dae1d6;line-height:1.45;font-size:12px}
.section-heading{font-size:9px;text-transform:uppercase;letter-spacing:.15em;color:#aab7a5;margin-bottom:6px}
.pv-list{flex:1;min-height:0;overflow:auto;padding-right:2px}
.pv-line{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(238,242,223,.08);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:#dddeda}
.pv-line:last-child{border-bottom:0} .pv-move{color:#f1eee7}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 10px} .meta{background:#213128;border:1px solid rgba(238,242,223,.08);border-radius:9px;padding:9px} .meta .num{font-size:18px;font-weight:850} .meta small{display:block;margin-top:2px;color:#9eaa9c;font-size:9px;text-transform:uppercase;letter-spacing:.08em}
.analysis-actions{display:flex;gap:6px;margin-top:10px} .analysis-actions button{height:34px;border-radius:8px;border:1px solid var(--line);background:#172a1e;color:var(--cream);font-size:11px;font-weight:800;padding:0 11px} .analysis-actions button:hover{border-color:#63765c}
.status{min-height:17px;margin-top:8px;font-size:10px;color:var(--muted)}
.spinner{display:inline-block;width:10px;height:10px;border:2px solid #ffffff25;border-top-color:currentColor;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:5px} @keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:900px){html,body{overflow:auto}.main{height:auto;min-height:calc(100vh - 56px);padding-bottom:18px}.setup-view{height:auto;min-height:calc(100vh - 56px)}.setup-content{height:auto}.board-frame{width:min(78vw,62vh,560px)}.setup-tools,.action-row,.fen-row{width:min(78vw,560px)}.analysis-view{height:auto;min-height:calc(100vh - 76px);grid-template-columns:1fr;gap:14px;padding:8px 0 18px}.analysis-board-wrap{justify-content:center}.analysis-board-frame{width:min(78vw,60vh,560px)}.analysis-card{height:auto;min-height:420px;justify-self:stretch}}
</style>
</head>
<body>
<div class="app">
<header class="header">
  <div class="brand"><span class="brand-mark"><span class="brand-mouth"></span></span><span class="brand-name">ENIGMA</span><span class="brand-divider"></span><span class="version">v2.1</span></div>
  <div class="header-right">CHESS ANALYSIS</div>
</header>
<main class="main">
<section id="setupView" class="setup-view">
  <div class="setup-content">
    <div class="board-frame"><div class="board" id="board"></div></div>
    <div class="setup-tools">
      <div class="palette" id="palette"></div>
      <button class="tool-btn" id="eraser">Erase</button>
    </div>
    <div class="action-row">
      <button class="action-btn" id="clear">Clear</button>
      <button class="action-btn" id="start">Starting position</button>
      <button class="action-btn" id="flip">Flip ↕</button>
      <div class="side-toggle"><button id="whiteTurn" class="active">W</button><button id="blackTurn">B</button></div>
    </div>
    <div class="fen-row"><input id="fen" placeholder="Paste FEN…"><button class="fen-load" id="load">Load FEN</button></div>
    <button class="go-btn" id="go" disabled>GO</button>
    <div class="status-line" id="setupStatus">Loading local Stockfish…</div>
  </div>
</section>
<section id="analysisView" class="analysis-view hidden" aria-hidden="true">
  <div class="analysis-board-wrap"><div class="analysis-board-frame"><div class="board" id="analysisBoard"></div></div></div>
  <section class="analysis-card">
    <div class="analysis-head">
      <div class="analysis-title"><div class="analysis-icon">♛</div><h2>Analysis</h2></div>
      <div id="enginePill" class="engine-pill">ENGINE: READY</div>
    </div>
    <div class="best-card">
      <div class="best-tag">Best Move</div>
      <div class="best-line"><div id="best" class="best-move">—</div><div id="eval" class="eval">—</div></div>
      <div id="why" class="why">Press GO to calculate the strongest move in this position.</div>
    </div>
    <div class="section-heading">Principal Variation</div>
    <div id="pvList" class="pv-list"></div>
    <div class="meta-grid">
      <div class="meta"><div class="num" id="depth">—</div><small>Depth</small></div>
      <div class="meta"><div class="num" id="turnInfo">White</div><small>Side to move</small></div>
    </div>
    <div class="analysis-actions"><button id="back">← Edit position</button><button id="newPosition">Starting position</button></div>
    <div id="status" class="status">Ready.</div>
  </section>
</section>
</main>
</div>

function renderInto(targetId){

    let idx=flipped ? 63-i : i;
    const d=document.createElement('div'); d.className='sq '+(((Math.floor(idx/8)+idx%8)%2===0)?'light':'dark');

function explain(u){

   $('best').textContent=sanFromUci(u); $('why').textContent=explain(u);
   $('pvList').innerHTML=''; pv.slice(0,8).forEach((move,index)=>{const row=document.createElement('div');row.className='pv-line';const no=document.createElement('span');no.style.color='#858f81';no.textContent=(index+1)+'.';const mv=document.createElement('span');mv.className='pv-move';mv.textContent=index===0?sanFromUci(move):move;row.append(no,mv);$('pvList').appendChild(row)});
   last={from:u.slice(0,2),to:u.slice(2,4)}; searching=false; setEngineState('ENGINE: READY'); $('status').textContent='Analysis complete.'; renderAnalysis();
 }
}
function enterAnalysis(){
 $('setupView').classList.add('hidden'); $('analysisView').classList.remove('hidden'); $('analysisView').setAttribute('aria-hidden','false');
 $('turnInfo').textContent=side==='w'?'White':'Black'; renderAnalysis();
}
function leaveAnalysis(){
 if(searching&&engine){engine.postMessage('stop');searching=false}
 $('analysisView').classList.add('hidden');$('analysisView').setAttribute('aria-hidden','true');$('setupView').classList.remove('hidden');setEngineState('ENGINE: READY');renderSetup();
}
function go(){
 if(!engineReady||searching)return;
 searching=true;pv=[];$('best').textContent='…';$('eval').textContent='…';$('depth').textContent='…';$('why').textContent='The engine is calculating the position.';$('pvList').innerHTML='';$('status').innerHTML='<span class="spinner"></span>Thinking…';setEngineState('ENGINE: THINKING','thinking');enterAnalysis();engine.postMessage('ucinewgame');engine.postMessage('position fen '+currentFen());engine.postMessage('go depth 18');
}
$('eraser').onclick=()=>{tool='erase';document.querySelectorAll('.piece-btn').forEach(b=>b.classList.remove('selected'));$('eraser').classList.add('active')};
$('clear').onclick=clearBoard; $('start').onclick=startingPosition; $('flip').onclick=()=>{flipped=!flipped;renderSetup()};
$('whiteTurn').onclick=()=>{side='w';$('whiteTurn').classList.add('active');$('blackTurn').classList.remove('active')};
$('blackTurn').onclick=()=>{side='b';$('blackTurn').classList.add('active');$('whiteTurn').classList.remove('active')};
$('load').onclick=()=>loadFen($('fen').value); $('fen').addEventListener('keydown',e=>{if(e.key==='Enter')loadFen($('fen').value)});
$('go').onclick=go; $('back').onclick=leaveAnalysis; $('newPosition').onclick=()=>{startingPosition();leaveAnalysis()};
paletteInit(); startingPosition(); startEngine();
</script>
</body>
