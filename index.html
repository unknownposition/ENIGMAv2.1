<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ENIGMA v2.0 • Chess Analysis</title>
<style>
:root{
  --bg:#0b1711;
  --bg2:#0d1d15;
  --panel:#12231a;
  --panel2:#182b20;
  --line:rgba(232,241,221,.16);
  --cream:#eef1df;
  --muted:#aeb9a8;
  --accent:#6f9852;
  --accent2:#80aa62;
  --board-dark:#294c2a;
  --board-light:#eef2df;
  --selected:#a7cf80;
  --shadow:0 20px 60px rgba(0,0,0,.34);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--cream);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit;cursor:pointer}
.app{width:100%;height:100%;display:flex;flex-direction:column}
.header{height:58px;flex:0 0 58px;padding:0 30px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:rgba(8,20,14,.9)}
.brand{display:flex;align-items:center;gap:13px}.brand-name{font-family:Georgia,"Times New Roman",serif;font-size:24px;letter-spacing:.24em;line-height:1}.brand-divider{width:1px;height:24px;background:rgba(238,241,223,.26)}.version{font-size:11px;letter-spacing:.17em;color:var(--muted)}.header-right{font-size:10px;letter-spacing:.34em;color:#c9d1c4}
.brand-mark{position:relative;width:32px;height:22px;display:inline-block}.brand-mark:before{content:"";position:absolute;left:4px;top:6px;width:24px;height:15px;border-radius:50%;background:#8eb16d}.brand-mark:after{content:"";position:absolute;left:9px;top:1px;width:6px;height:6px;border-radius:50%;background:#8eb16d;box-shadow:9px 0 0 #8eb16d}.brand-mouth{position:absolute;z-index:2;left:11px;top:13px;width:11px;height:3px;border-radius:4px;background:#0b1711}
.main{flex:1;min-height:0;height:calc(100vh - 58px);display:flex;align-items:center;justify-content:center;padding:10px 22px 12px}
.setup-view{width:100%;height:100%;display:flex;align-items:center;justify-content:center}.setup-view.hidden{display:none!important}
.board-area{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
.board-frame{width:min(68vh,560px,82vw);aspect-ratio:1;padding:6px;border:1px solid rgba(238,242,223,.18);border-radius:13px;background:#102016;box-shadow:var(--shadow);flex:0 0 auto}
.board{width:100%;height:100%;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));border-radius:8px;overflow:hidden}
.sq{position:relative;min-width:0;min-height:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;user-select:none;cursor:pointer;overflow:hidden}
.sq.light{background:var(--board-light)}.sq.dark{background:var(--board-dark)}
.sq.selected{box-shadow:inset 0 0 0 3px var(--selected)}.sq.last{box-shadow:inset 0 0 0 999px rgba(167,207,128,.18)}
.coord{position:absolute;z-index:5;font-size:9px;font-weight:800;line-height:1;opacity:.72;pointer-events:none}.rank{left:4px;top:4px}.file{right:4px;bottom:4px}.sq.light .coord{color:#4b6040}.sq.dark .coord{color:#e2ead8}
.piece{position:absolute;z-index:2;width:84%;height:84%;object-fit:contain;object-position:center;pointer-events:none;user-select:none}.piece.white-piece{filter:invert(96%) sepia(11%) saturate(284%) hue-rotate(34deg) brightness(102%) contrast(92%) drop-shadow(0 2px 2px rgba(0,0,0,.24))}.piece.black-piece{filter:brightness(.08) drop-shadow(0 2px 2px rgba(0,0,0,.18))}
.controls{display:flex;align-items:center;gap:8px;margin-top:9px;max-width:calc(min(68vh,560px,82vw));width:min(100%,760px)}
.palette{display:flex;align-items:center;justify-content:center;gap:5px;flex:1;min-width:0}.piece-btn{width:35px;height:35px;flex:0 0 35px;padding:4px;border-radius:8px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;transition:.14s}.piece-btn:hover{border-color:rgba(238,242,223,.35);transform:translateY(-1px)}.piece-btn.selected{background:#2f512f;border-color:var(--selected);box-shadow:0 0 0 1px var(--selected)}.piece-btn img{width:100%;height:100%;object-fit:contain}.piece-btn img.white-piece{filter:invert(96%) sepia(11%) saturate(284%) hue-rotate(34deg) brightness(102%) contrast(92%)}.piece-btn img.black-piece{filter:brightness(.08)}
.side-toggle{display:flex;border:1px solid var(--line);background:var(--panel);border-radius:8px;overflow:hidden;flex:0 0 auto}.side-toggle button{border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:800;width:31px;height:35px}.side-toggle button.active{background:#355733;color:#eff5e6}
.go-btn{margin-top:9px;width:min(210px,54vw);height:42px;border:1px solid transparent;border-radius:10px;background:var(--accent);color:white;font-size:13px;font-weight:850;letter-spacing:.14em;box-shadow:0 9px 24px rgba(76,116,57,.24)}.go-btn:hover{background:var(--accent2);transform:translateY(-1px)}.go-btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.hint{display:none}
#analysisView[hidden]{display:none!important}
.analysis-view{width:100%;height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:center;animation:enter .45s ease both}.analysis-board{min-width:0;display:flex;align-items:center;justify-content:center}.analysis-board .board-frame{width:min(72vh,560px,42vw)}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.analysis-card{width:100%;max-width:720px;justify-self:start;border:1px solid rgba(238,242,223,.14);background:linear-gradient(180deg,rgba(19,38,28,.96),rgba(14,29,21,.96));border-radius:16px;padding:22px;box-shadow:var(--shadow);min-height:0;max-height:min(72vh,560px);overflow:auto}
.analysis-top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:17px}.analysis-title{display:flex;align-items:center;gap:10px}.analysis-icon{font-size:22px;color:#e6eadb}.analysis-title h2{font-family:Georgia,"Times New Roman",serif;font-size:27px;font-weight:400;margin:0}.engine-pill{padding:7px 10px;border-radius:8px;background:#253529;border:1px solid #526a49;color:#cbd7c3;font-size:9px;letter-spacing:.1em;white-space:nowrap}.engine-pill:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#8db469;margin-right:6px}.engine-pill.thinking:before{background:#d4bb67;animation:pulse 1s infinite}.engine-pill.error{color:#efc0b8;border-color:#71483f;background:#3d2824}.engine-pill.error:before{background:#cc7c6d}@keyframes pulse{50%{opacity:.25}}
.best-card{background:#203629;border:1px solid #4b6946;border-radius:12px;padding:16px;margin-bottom:17px}.best-tag{display:inline-block;padding:4px 8px;border-radius:6px;background:#5d8844;color:#eef5e6;font-size:9px;font-weight:850;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}.best-line{display:flex;align-items:baseline;gap:10px}.best-move{font-size:29px;font-weight:850}.eval{font-size:12px;color:#bdcbb8}.why{margin-top:8px;color:#d9dfd6;line-height:1.45;font-size:12px}
.analysis-section{padding-top:1px}.section-heading{font-size:9px;text-transform:uppercase;letter-spacing:.15em;color:#a9b4a5;margin-bottom:7px}.pv-line{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(238,242,223,.08);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:#dddeda}.pv-line:last-child{border-bottom:0}.pv-move{color:#f1eee7}
.analysis-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.meta{background:#213027;border:1px solid rgba(238,242,223,.08);border-radius:9px;padding:9px}.meta .num{font-size:18px;font-weight:800}.meta small{display:block;margin-top:1px;color:#9eaa9b;font-size:8px;letter-spacing:.11em;text-transform:uppercase}.bottom-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:15px}.back-btn{border:1px solid var(--line);background:transparent;color:#c9d0c3;border-radius:8px;padding:8px 10px;font-size:10px}.status{font-size:10px;color:#9eaa9b;text-align:right;min-height:14px}.loading{display:inline-flex;align-items:center;gap:7px}.spinner{width:11px;height:11px;border:2px solid rgba(255,255,255,.16);border-top-color:#dcebc9;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:900px){body{overflow:auto}.header{padding:0 18px}.header-right{display:none}.main{height:auto;min-height:calc(100vh - 58px);padding:18px}.board-frame{width:min(72vw,560px)}.controls{max-width:92vw}.piece-btn{width:30px;height:30px;flex-basis:30px}.side-toggle button{height:30px;width:28px}.analysis-view{height:auto;grid-template-columns:1fr;gap:18px}.analysis-board .board-frame{width:min(72vw,560px)}.analysis-card{max-height:none;justify-self:stretch}.analysis-card{width:100%}}
</style>
</head>
<body>
<div class="app">
<header class="header"><div class="brand"><span class="brand-mark"><span class="brand-mouth"></span></span><span class="brand-name">ENIGMA</span><span class="brand-divider"></span><span class="version">v2.0</span></div><div class="header-right">CHESS ANALYSIS</div></header>
<main class="main">
<section id="setupView" class="setup-view">
<div class="board-area">
<div class="board-frame"><div id="board" class="board"></div></div>
<div class="controls"><div id="palette" class="palette"></div><div class="side-toggle"><button id="whiteTurn" class="active">W</button><button id="blackTurn">B</button></div></div>
<button id="go" class="go-btn" disabled>GO</button>
</div>
</section>
<section id="analysisView" class="analysis-view" hidden>
<div class="analysis-board"><div class="board-frame"><div id="analysisBoard" class="board"></div></div></div>
<aside class="analysis-card">
<div class="analysis-top"><div class="analysis-title"><span class="analysis-icon">♛</span><h2>Analysis</h2></div><div id="enginePill" class="engine-pill">ENGINE: READY</div></div>
<div class="best-card"><div class="best-tag">Best Move</div><div class="best-line"><span id="best" class="best-move">—</span><span id="eval" class="eval">—</span></div><div id="why" class="why">Waiting for the engine.</div></div>
<div class="analysis-section"><div class="section-heading">Principal Variation</div><div id="pvList"></div></div>
<div class="analysis-meta"><div class="meta"><div id="depth" class="num">—</div><small>Depth</small></div><div class="meta"><div id="turnInfo" class="num">White</div><small>To move</small></div></div>
<div class="bottom-row"><button id="back" class="back-btn">← Edit position</button><div id="status" class="status">Analysis complete.</div></div>
</aside>
</section>
</main>
</div>

const palette=[['wq','Queen'],['wr','Rook'],['wb','Bishop'],['wn','Knight'],['wp','Pawn'],['wk','King'],['bq','Queen'],['br','Rook'],['bb','Bishop'],['bn','Knight'],['bp','Pawn'],['bk','King']];
let board=Array(64).fill(null),tool=null,side='w',engine=null,engineReady=false,searching=false,pv=[],last=null;
const $=id=>document.getElementById(id); function ix(s){return ranks.indexOf(s[1])*8+files.indexOf(s[0])}
function imgEl(p,cls){const i=document.createElement('img');i.className='piece '+cls;i.src=pieceImages[p];i.draggable=false;return i}
function renderInto(target){const b=$(target);b.innerHTML='';for(let i=0;i<64;i++){const d=document.createElement('div');d.className='sq '+(((Math.floor(i/8)+i%8)%2===0)?'light':'dark');if(last&&(i===ix(last.from)||i===ix(last.to)))d.classList.add('last');const p=board[i];if(p)d.appendChild(imgEl(p,p[0]==='w'?'white-piece':'black-piece'));if(i%8===0){const c=document.createElement('span');c.className='coord rank';c.textContent=ranks[Math.floor(i/8)];d.appendChild(c)}if(Math.floor(i/8)===7){const c=document.createElement('span');c.className='coord file';c.textContent=files[i%8];d.appendChild(c)}d.onclick=()=>clickSq(i);d.oncontextmenu=e=>{e.preventDefault();board[i]=null;last=null;renderAll()};b.appendChild(d)}}
function renderAll(){renderInto('board');if(!$('analysisView').hidden)renderInto('analysisBoard')}
function clickSq(i){if(tool==='erase')board[i]=null;else if(tool)board[i]=tool;last=null;renderAll()}
function paletteInit(){const p=$('palette');palette.forEach(([k,name])=>{const b=document.createElement('button');b.className='piece-btn';b.title=(k[0]==='w'?'White ':'Black ')+name;const im=document.createElement('img');im.src=pieceImages[k];im.className=k[0]==='w'?'white-piece':'black-piece';im.draggable=false;b.appendChild(im);b.onclick=()=>{tool=k;[...p.children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};p.appendChild(b)})}
function currentFen(){let out='';for(let r=0;r<8;r++){let empty=0;for(let f=0;f<8;f++){const p=board[r*8+f];if(!p){empty++;continue}if(empty){out+=empty;empty=0}out+=p[0]==='w'?p[1].toUpperCase():p[1]}if(empty)out+=empty;if(r<7)out+='/'}return `${out} ${side} - - 0 1`}
function sanFromUci(u){if(!u||u==='(none)')return '—';const from=ix(u.slice(0,2)),to=ix(u.slice(2,4)),piece=board[from];let s='';if(piece&&piece[1]!=='p')s=piece[1].toUpperCase()==='N'?'N':piece[1].toUpperCase();if(board[to])s+='x';s+=u.slice(2,4);if(u[4])s+='='+u[4].toUpperCase();return s}
function setEngineState(text,kind=''){const p=$('enginePill');p.textContent=text;p.className='engine-pill '+kind}
function startEngine(){try{engine=new Worker('engine/stockfish-18-lite-single.js');engine.onmessage=e=>handleEngine(String(e.data));engine.postMessage('uci')}catch(e){setEngineState('ENGINE: ERROR','error')}}
function handleEngine(msg){if(msg==='uciok'){engine.postMessage('setoption name MultiPV value 1');engine.postMessage('isready');return}if(msg==='readyok'){engineReady=true;$('go').disabled=false;return}if(msg.startsWith('info')){const dm=/\bdepth (\d+)/.exec(msg);if(dm)$('depth').textContent=dm[1];const m=/\bpv (.+)$/.exec(msg);if(m)pv=m[1].trim().split(/\s+/);const sc=/\bscore (cp|mate) (-?\d+)/.exec(msg);if(sc){if(sc[1]==='mate')$('eval').textContent=`M${Math.abs(Number(sc[2]))}`;else{const n=Number(sc[2])/100;$('eval').textContent=(n>0?'+':'')+n.toFixed(2)}}return}if(msg.startsWith('bestmove')){const u=msg.split(/\s+/)[1];$('best').textContent=sanFromUci(u);$('why').textContent=explain(u);$('pvList').innerHTML='';pv.slice(0,8).forEach((move,index)=>{const row=document.createElement('div');row.className='pv-line';const moveNo=document.createElement('span');moveNo.style.color='#858f81';moveNo.textContent=(index+1)+'.';const mv=document.createElement('span');mv.className='pv-move';mv.textContent=index===0?sanFromUci(move):move;row.append(moveNo,mv);$('pvList').appendChild(row)});last={from:u.slice(0,2),to:u.slice(2,4)};renderAll();searching=false;setEngineState('ENGINE: READY');$('status').textContent='Analysis complete.'}}
function explain(u){if(!u||u==='(none)')return 'The engine did not return a legal move for this position.';const from=ix(u.slice(0,2)),to=ix(u.slice(2,4)),p=board[from],dest=board[to];if(u.includes('000'))return 'The engine chooses castling to improve king safety and connect the rook.';if(dest)return `The engine prefers ${sanFromUci(u)} because it creates a concrete exchange or tactical change while improving the position.`;if(p&&p[1]==='p')return `The engine prefers ${sanFromUci(u)}, using the pawn move to gain space, open lines or create a tactical threat.`;return `The engine's top choice is ${sanFromUci(u)}. At this search depth, it gives the strongest objective result from the position.`}
function enterAnalysis(){ $('setupView').hidden=true; $('analysisView').hidden=false; $('turnInfo').textContent=side==='w'?'White':'Black';renderInto('analysisBoard');window.scrollTo(0,0)}
function backToSetup(){if(searching&&engine){engine.postMessage('stop');searching=false} $('analysisView').hidden=true;$('setupView').hidden=false;$('status').textContent='Ready to analyse.';last=null;renderAll()}
function go(){if(!engineReady||searching)return;searching=true;pv=[];$('best').textContent='…';$('eval').textContent='…';$('depth').textContent='…';$('why').textContent='The engine is calculating the position.';$('pvList').innerHTML='';$('status').innerHTML='<span class="loading"><span class="spinner"></span>Thinking…</span>';setEngineState('ENGINE: THINKING','thinking');enterAnalysis();engine.postMessage('ucinewgame');engine.postMessage('position fen '+currentFen());engine.postMessage('go depth 18')}
$('whiteTurn').onclick=()=>{side='w';$('whiteTurn').classList.add('active');$('blackTurn').classList.remove('active')};$('blackTurn').onclick=()=>{side='b';$('blackTurn').classList.add('active');$('whiteTurn').classList.remove('active')};$('go').onclick=go;$('back').onclick=backToSetup;
paletteInit();renderAll();startEngine();
</script>
